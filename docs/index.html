<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading-Bot Dashboard</title>
<meta name="description" content="Simuliertes Depot eines Trading-Bots: Depotwert, Entscheidungen mit Begründung, Analyse, News und Ereignisse.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --text: #4b5563; --text-h: #111827; --muted: #8a919e; --bg: #f7f8fa; --surface: #ffffff; --border: #e5e7eb;
  --blue: #2563eb; --blue-light: #eaf1fe; --green: #16a34a; --green-light: #dcfce7; --red: #dc2626; --red-light: #fee2e2;
  --yellow: #b45309; --yellow-light: #fef3c7; --purple: #7c3aed; --purple-light: #ede9fe; --chip: #f1f3f6;
  --shadow: rgba(0,0,0,.06) 0 1px 3px, rgba(0,0,0,.04) 0 1px 2px; --shadow-hover: rgba(0,0,0,.1) 0 6px 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --text: #b4bcc8; --text-h: #f1f4f8; --muted: #7d8696; --bg: #0d1117; --surface: #151b23; --border: #262e3a;
    --blue: #5b93ff; --blue-light: #16233d; --green: #34d07a; --green-light: #10291b; --red: #ff6b6b; --red-light: #331516;
    --yellow: #f2b544; --yellow-light: #30240d; --purple: #a78bfa; --purple-light: #241b3d; --chip: #1c2430;
    --shadow: rgba(0,0,0,.3) 0 1px 3px; --shadow-hover: rgba(0,0,0,.45) 0 6px 16px;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text);
  background: var(--bg); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { color: var(--text-h); font-weight: 600; margin: 0; }
h1 { font-size: 22px; } h2 { font-size: 16px; } h3 { font-size: 14px; }
a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
button { font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 8px 14px; background: var(--blue);
  color: #fff; font-weight: 500; }
input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); color: var(--text-h); }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--green); } .down { color: var(--red); } .muted { color: var(--muted); }

/* Shell */
.app-shell { display: flex; min-height: 100svh; }
.sidebar { width: 230px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  padding: 20px; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100svh; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--blue), var(--purple));
  display: flex; align-items: center; justify-content: center; color: #fff; }
.brand strong { color: var(--text-h); display: block; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12px; }
.sidebar nav { display: flex; flex-direction: column; gap: 4px; }
.sidebar nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--text);
  font-weight: 500; text-decoration: none; }
.sidebar nav a svg { opacity: .7; flex-shrink: 0; }
.sidebar nav a:hover { background: var(--chip); }
.sidebar nav a.nav-active { background: var(--blue-light); color: var(--blue); }
.sidebar nav a.nav-active svg { opacity: 1; }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.content { flex: 1; min-width: 0; padding: 28px 32px 48px; }
.page-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.page-header .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* Cards */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px;
  display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow); transition: transform .15s ease, box-shadow .15s ease; min-width: 0; }
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.stat-card > div:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.t-blue { background: var(--blue-light); color: var(--blue); } .t-green { background: var(--green-light); color: var(--green); }
.t-yellow { background: var(--yellow-light); color: var(--yellow); } .t-purple { background: var(--purple-light); color: var(--purple); }
.t-red { background: var(--red-light); color: var(--red); }
.stat-label { font-size: 12.5px; }
.stat-value { font-size: 21px; font-weight: 600; color: var(--text-h); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 12.5px; }
.panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.panel-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.wide { grid-column: 1 / -1; }
.segmented { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
.segmented button { background: transparent; color: var(--text); padding: 5px 10px; font-size: 12.5px; border-radius: 6px; }
.segmented button.active { background: var(--surface); color: var(--text-h); box-shadow: var(--shadow); }
.chart-box { position: relative; height: 290px; }
.chart-box.small { height: 220px; }

/* Badges & chips */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.b-green { background: var(--green-light); color: var(--green); } .b-red { background: var(--red-light); color: var(--red); }
.b-yellow { background: var(--yellow-light); color: var(--yellow); } .b-blue { background: var(--blue-light); color: var(--blue); }
.b-gray { background: var(--chip); color: var(--text); } .b-purple { background: var(--purple-light); color: var(--purple); }
.score { display: inline-block; min-width: 34px; text-align: center; padding: 2px 7px; border-radius: 6px; font-weight: 600;
  font-size: 12.5px; background: var(--chip); color: var(--text); font-variant-numeric: tabular-nums; }
.score.pos { background: var(--green-light); color: var(--green); } .score.neg { background: var(--red-light); color: var(--red); }
.ticker-chip { font-weight: 700; color: var(--text-h); background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12.5px; cursor: pointer; }

/* Tables */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
.data-table { width: 100%; border-collapse: collapse; }
.data-table th, .data-table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; white-space: nowrap; }
.data-table th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; cursor: default; }
.data-table th.sortable { cursor: pointer; user-select: none; }
.data-table th.sortable:hover { color: var(--text-h); }
.data-table td.r, .data-table th.r { text-align: right; }
.data-table tr:last-child td { border-bottom: none; }
.clickable-row { cursor: pointer; } .clickable-row:hover td { background: var(--chip); }
.name-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

/* Decisions */
.decision { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.decision-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 16px 20px; cursor: pointer; }
.decision-head:hover { background: var(--chip); }
.decision-head .title { font-weight: 600; color: var(--text-h); }
.decision-head .meta { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 13px; }
.decision-body { padding: 4px 20px 20px; border-top: 1px solid var(--border); }
.explain { color: var(--text-h); background: var(--blue-light); border-radius: 10px; padding: 14px 16px; margin: 16px 0; line-height: 1.6; }
.explain.sell { background: var(--red-light); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
.sec-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }

/* Score bars */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 82px 1fr 34px; align-items: center; gap: 10px; font-size: 13px; }
.bar-track { position: relative; height: 10px; background: var(--chip); border-radius: 5px; }
.bar-track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--border); }
.bar-fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; }
.bar-fill.pos { left: 50%; background: var(--green); } .bar-fill.neg { right: 50%; background: var(--red); }

/* Checklist */
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.ck { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; font-weight: 700; }
.ck.ok { background: var(--green-light); color: var(--green); } .ck.no { background: var(--red-light); color: var(--red); }

/* Reasons */
.reasons { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.reasons li { font-size: 14px; }
.reasons .cat { font-weight: 600; color: var(--text-h); margin-right: 6px; }

/* Indicators */
.ind-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.ind { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.ind .k { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.ind .v { font-size: 17px; font-weight: 600; color: var(--text-h); font-variant-numeric: tabular-nums; }
.ind .d { font-size: 12.5px; margin-top: 2px; }
.info { display: inline-flex; width: 16px; height: 16px; border-radius: 50%; background: var(--chip); color: var(--muted);
  font-size: 11px; align-items: center; justify-content: center; cursor: help; flex-shrink: 0; font-weight: 700; }

/* Feed */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.toolbar input[type=search] { min-width: 200px; flex: 1; max-width: 340px; }
.day-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 8px; }
.feed { display: flex; flex-direction: column; gap: 8px; }
.event { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
.event .ev-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.event .ev-main { min-width: 0; flex: 1; }
.event .ev-title { color: var(--text-h); font-weight: 500; }
.event .ev-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; }
.event .ev-detail { font-size: 13px; margin-top: 4px; }
.list-compact { display: flex; flex-direction: column; }
.list-compact .item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.list-compact .item:last-child { border-bottom: none; }
.list-compact .item:hover .ev-title { color: var(--blue); }
.empty { color: var(--muted); padding: 20px 0; text-align: center; font-size: 14px; }

/* Stock detail */
.back { background: transparent; color: var(--text); padding: 6px 0; font-weight: 500; }
.price-big { font-size: 30px; font-weight: 650; color: var(--text-h); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; color: var(--text-h); font-variant-numeric: tabular-nums; }
.legend-row { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }
.legend-row span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.glossary dt { font-weight: 600; color: var(--text-h); margin-top: 14px; } .glossary dd { margin: 4px 0 0; }
.rules li { margin-bottom: 10px; }
footer.note { margin-top: 28px; font-size: 12.5px; color: var(--muted); }

@media (max-width: 860px) {
  .app-shell { flex-direction: column; }
  .sidebar { width: auto; height: auto; position: sticky; top: 0; z-index: 5; flex-direction: row; align-items: center;
    padding: 10px 12px; gap: 12px; border-right: none; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .sidebar .brand div:last-child, .side-foot { display: none; }
  .sidebar nav { flex-direction: row; gap: 2px; }
  .sidebar nav a { padding: 7px 10px; font-size: 14px; white-space: nowrap; }
  .sidebar nav a svg { display: none; }
  .content { padding: 18px 16px 40px; }
  .decision-head .meta { margin-left: 0; width: 100%; }
  .stat-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .stat-card { padding: 12px; gap: 10px; } .stat-icon { width: 34px; height: 34px; }
  .stat-value { font-size: 18px; }
}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg></div>
      <div><strong>Trading-Bot</strong><small>Simulation · 1.000 €</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span id="side-status"></span>
      <span>Spielgeld · keine Anlageberatung</span>
    </div>
  </aside>
  <main class="content" id="view"><div class="empty">Lade Daten …</div></main>
</div>

<script>
// ------------------------------------------------------------------ Grundlagen
const CATS = ["Signale", "Trend", "Momentum", "Volumen", "Intraday", "News"];
const CAT_INFO = {
  Signale: "Was bekannte Investoren tun: Buffett/Berkshire hält die Aktie (+2), ein Kongressmitglied hat gekauft (+2) oder verkauft (−1).",
  Trend: "Geht es langfristig nach oben? Kurs über dem 50-Tage-Schnitt, 50- über 200-Tage-Schnitt, Golden/Death Cross und Trendstärke (ADX).",
  Momentum: "Hat der Kurs gerade Schwung? MACD, RSI, Stochastik, Bollinger-Bänder und Rendite der letzten 20 Tage.",
  Volumen: "Steckt echtes Geld dahinter? Handelsvolumen, OBV, Chaikin Money Flow und ob an Plus- oder Minus-Tagen mehr gehandelt wird.",
  Intraday: "Wie läuft der heutige Tag? Kurs über/unter dem Tages-Durchschnittspreis (VWAP) und Ausbruch aus den ersten 30 Minuten.",
  News: "Stimmung in den Schlagzeilen (positiv/negativ) und wichtige SEC-Meldungen (Quartalszahlen, Vorstandswechsel, Warnungen).",
};
const ICONS = {
  uebersicht: "M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z",
  entscheidungen: "M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9",
  aktien: "M4 4v16h16M8 15l3-4 3 2 5-6",
  news: "M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5",
  regeln: "M12 3v18M5 7h14M7 7l-3 7a3 3 0 0 0 6 0zM17 7l-3 7a3 3 0 0 0 6 0z",
  wallet: "M3 7h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12M17 13h.01",
  trend: "M3 17l6-6 4 4 8-8M15 7h6v6",
  cash: "M3 6h18v12H3zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
  layers: "M12 3l9 5-9 5-9-5zM3 13l9 5 9-5",
  target: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z",
  swap: "M7 7h13l-3-3M17 17H4l3 3",
  doc: "M7 3h7l5 5v13H7zM14 3v5h5",
  bank: "M3 10l9-6 9 6M5 10v8M19 10v8M9 10v8M15 10v8M3 20h18",
  bot: "M12 3v3M6 8h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zM9 13h.01M15 13h.01",
  globe: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3a14 14 0 0 1 0 18",
};
const NAV = [["uebersicht", "Übersicht"], ["entscheidungen", "Entscheidungen"], ["aktien", "Aktien & Analyse"],
             ["news", "News & Ereignisse"], ["regeln", "Regeln & Glossar"]];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (p, s = 18) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`;
const nf = (x, d = 2) => Number(x).toLocaleString("de-DE", {minimumFractionDigits: d, maximumFractionDigits: d});
const eur = (x, d = 2) => x == null || isNaN(x) ? "–" : nf(x, d) + " €";
const usd = (x, d = 2) => x == null || isNaN(x) ? "–" : nf(x, d) + " $";
const pct = (x, d = 2) => x == null || isNaN(x) ? "–" : (x > 0 ? "+" : "") + nf(x, d) + " %";
const signed = (x, f = eur) => x == null || isNaN(x) ? "–" : (x > 0 ? "+" : "") + f(x);
const cls = x => x > 0 ? "up" : x < 0 ? "down" : "";
const dt = iso => iso ? new Date(iso).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}) : "–";
const dday = iso => new Date(iso).toLocaleDateString("de-DE", {weekday: "long", day: "numeric", month: "long"});
const ago = iso => {
  const m = (Date.now() - new Date(iso)) / 60000;
  if (m < 1) return "gerade eben"; if (m < 60) return `vor ${Math.round(m)} Min.`;
  if (m < 1440) return `vor ${Math.round(m / 60)} Std.`; return `vor ${Math.round(m / 1440)} Tagen`;
};
const scoreChip = v => `<span class="score ${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" : ""}${v}</span>`;
const safeLink = (url, text) => /^https?:\/\//.test(url || "") ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${text}</a>` : text;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; } else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const [head, ...body] = rows;
  return head ? body.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]]))) : [];
}
async function get(name, kind = "json") {
  try { const r = await fetch("data/" + name + "?t=" + Date.now()); if (!r.ok) return null;
        return kind === "json" ? r.json() : parseCSV(await r.text()); } catch { return null; }
}

// ------------------------------------------------------------------ Daten
let D = {}; const charts = []; const ui = {range: "all", spx: true, decFilter: "all", stockFilter: "all", stockSort: "total",
  stockDir: -1, q: "", evType: "all", evTone: "all", evSym: "", evQ: "", open: new Set()};

async function loadData() {
  const [an, pf, st, eq, tr, dec, ev] = await Promise.all([get("analysis.json"), get("portfolio.json"), get("status.json"),
    get("equity.csv", "csv"), get("trades.csv", "csv"), get("decisions.json"), get("events.json")]);
  const rows = an?.rows || [];
  const bySym = Object.fromEntries(rows.map(r => [r.sym, r]));
  const fx = an?.fx || pf?.fx || 1.1;
  const positions = Object.entries(pf?.positions || {}).map(([sym, p]) => {
    const price = bySym[sym]?.price ?? p.entry;
    const value = p.shares * price / fx;
    return {sym, ...p, price, value, pnl: value - p.cost_eur, pnlPct: (value / p.cost_eur - 1) * 100};
  }).sort((a, b) => b.value - a.value);
  const start = pf?.start_cash ?? an?.start_cash ?? 1000;
  const cash = pf?.cash ?? start;
  const equity = cash + positions.reduce((a, p) => a + p.value, 0);
  D = {an, pf, st, eq: eq || [], tr: tr || [], dec: (dec || []).slice().reverse(), ev: ev || [], rows, bySym, fx,
       positions, start, cash, equity, rules: an?.rules || {}};
}

// ------------------------------------------------------------------ Erklärungen
const IND = {
  rsi: {n: "RSI (14)", f: v => nf(v, 0), d: v => v < 30 ? "überverkauft – oft folgt eine Gegenbewegung nach oben" : v > 70 ? "überkauft – Kurs ist schnell gestiegen, Rücksetzer möglich" : "neutraler Bereich (30–70)",
        i: "Relative Stärke Index: misst, wie stark die letzten Kursbewegungen waren. Unter 30 = stark gefallen, über 70 = stark gestiegen."},
  adx: {n: "ADX (Trendstärke)", f: v => nf(v, 0), d: v => v >= 25 ? "starker Trend" : "kein klarer Trend",
        i: "Average Directional Index: zeigt, wie stark ein Trend ist – egal ob nach oben oder unten. Ab 25 gilt ein Trend als stark."},
  macd_hist: {n: "MACD-Histogramm", f: v => nf(v, 2), d: v => v > 0 ? "Schwung nach oben" : "Schwung nach unten",
        i: "Differenz zwischen schnellem und langsamem gleitenden Durchschnitt. Positiv = der Kurs beschleunigt nach oben."},
  stoch_k: {n: "Stochastik %K", f: v => nf(v, 0), d: v => v < 20 ? "nahe Tief der letzten 14 Tage" : v > 80 ? "nahe Hoch der letzten 14 Tage" : "Mitte der 14-Tage-Spanne",
        i: "Wo steht der Kurs innerhalb der Spanne der letzten 14 Tage? 0 = am Tief, 100 = am Hoch."},
  rvol: {n: "Relatives Volumen", f: v => nf(v, 1) + "x", d: v => v >= 1.5 ? "deutlich mehr Handel als üblich" : v < 0.7 ? "ruhiger Handel" : "normaler Handel",
        i: "Heutiges Handelsvolumen im Vergleich zum 20-Tage-Durchschnitt. Hohe Werte zeigen, dass viele Anleger aktiv sind."},
  cmf: {n: "Chaikin Money Flow", f: v => nf(v, 2), d: v => v > 0.05 ? "Geld fließt hinein" : v < -0.05 ? "Geld fließt ab" : "ausgeglichen",
        i: "Misst über 20 Tage, ob die Schlusskurse eher am Tageshoch (Kaufdruck) oder am Tagestief (Verkaufsdruck) liegen – gewichtet mit Volumen."},
  buy_sell_ratio: {n: "Kauf-/Verkaufsvolumen", f: v => nf(v, 2) + "x", d: v => v > 1.3 ? "mehr Volumen an Plus-Tagen (Kaufdruck)" : v < 0.77 ? "mehr Volumen an Minus-Tagen (Verkaufsdruck)" : "ausgeglichen",
        i: "Volumen an Tagen mit steigendem Kurs geteilt durch Volumen an fallenden Tagen (20 Tage)."},
  obv_trend: {n: "OBV-Trend", f: v => (v > 0 ? "+" : "") + nf(v, 2), d: v => v > 0.1 ? "Akkumulation (Anleger sammeln ein)" : v < -0.1 ? "Distribution (Anleger verkaufen)" : "seitwärts",
        i: "On-Balance-Volume: addiert Volumen an Plus-Tagen und zieht es an Minus-Tagen ab. Steigt OBV, wird eher gekauft."},
  roc20: {n: "Rendite 20 Tage", f: v => pct(v, 1), d: v => v > 5 ? "starkes Momentum" : v < -5 ? "schwaches Momentum" : "moderat", i: "Kursveränderung in den letzten 20 Handelstagen."},
  atr: {n: "ATR (Schwankung)", f: v => usd(v), d: () => "typische Tagesschwankung", i: "Average True Range: durchschnittliche Tagesspanne der letzten 14 Tage. Der Bot setzt damit seine Stops."},
  vwap: {n: "VWAP (Tagesdurchschnitt)", f: v => usd(v), d: (v, r) => r.price > v ? "Kurs liegt darüber – Käufer haben die Oberhand" : "Kurs liegt darunter – Verkäufer haben die Oberhand",
        i: "Volumengewichteter Durchschnittspreis des Tages. Profis nutzen ihn als fairen Tagespreis."},
  sma50: {n: "50-Tage-Linie", f: v => usd(v), d: (v, r) => r.price > v ? "Kurs darüber – kurzfristiger Aufwärtstrend" : "Kurs darunter – kurzfristig schwach", i: "Durchschnittskurs der letzten 50 Handelstage."},
  sma200: {n: "200-Tage-Linie", f: v => usd(v), d: (v, r) => r.price > v ? "Kurs darüber – langfristiger Aufwärtstrend" : "Kurs darunter – langfristiger Abwärtstrend", i: "Durchschnittskurs der letzten 200 Handelstage – die wichtigste Langfrist-Linie."},
  high52: {n: "52-Wochen-Hoch", f: v => usd(v), d: (v, r) => pct((r.price / v - 1) * 100, 1) + " vom Hoch", i: "Höchster Kurs des letzten Jahres."},
  low52: {n: "52-Wochen-Tief", f: v => usd(v), d: (v, r) => pct((r.price / v - 1) * 100, 1) + " über dem Tief", i: "Tiefster Kurs des letzten Jahres."},
  bb_width: {n: "Bollinger-Breite", f: v => nf(v, 1) + " %", d: v => v < 6 ? "enge Bänder – oft vor einer großen Bewegung" : "normale Schwankung", i: "Abstand zwischen oberem und unterem Bollinger-Band in Prozent des Kurses."},
};
const IND_ORDER = ["rsi", "macd_hist", "adx", "stoch_k", "rvol", "cmf", "buy_sell_ratio", "obv_trend", "roc20", "vwap", "sma50", "sma200", "high52", "low52", "atr", "bb_width"];

function indGrid(r, keys = IND_ORDER) {
  const ind = r.ind || {};
  return `<div class="ind-grid">${keys.filter(k => ind[k] != null).map(k => {
    const m = IND[k], v = ind[k];
    return `<div class="ind"><div class="k">${m.n}<span class="info" title="${esc(m.i)}">i</span></div>
      <div class="v">${m.f(v)}</div><div class="d">${esc(m.d(v, r))}</div></div>`;
  }).join("")}</div>`;
}
function scoreBars(scores, reasons) {
  return `<div class="bars">${CATS.map(c => {
    const v = scores[c] || 0, w = Math.min(Math.abs(v), 4) / 4 * 50;
    return `<div class="bar-row" title="${esc(CAT_INFO[c] + (reasons?.[c]?.length ? "\n\n" + reasons[c].join("\n") : ""))}">
      <span>${c}</span><div class="bar-track"><div class="bar-fill ${v >= 0 ? "pos" : "neg"}" style="width:${w}%"></div></div>
      <span class="r">${scoreChip(v)}</span></div>`;
  }).join("")}</div>`;
}
function checklist(checks) {
  return `<ul class="checks">${(checks || []).map(c => `<li><span class="ck ${c.ok ? "ok" : "no"}">${c.ok ? "✓" : "✕"}</span>
    <span>${esc(c.rule)} <span class="muted">– aktuell: ${esc(c.val)}</span></span></li>`).join("")}</ul>`;
}
function reasonList(r) {
  return `<ul class="reasons">${CATS.filter(c => (r.reasons?.[c] || []).length).map(c =>
    `<li><span class="cat">${c}</span>${scoreChip(r.scores[c])}<div class="muted" style="margin-top:3px">${r.reasons[c].map(esc).join(" · ")}</div></li>`).join("")}</ul>`;
}
function headlineList(hs) {
  if (!hs?.length) return `<div class="muted" style="font-size:14px">Keine passenden Schlagzeilen.</div>`;
  return `<div class="list-compact">${hs.map(h => `<div class="item" style="cursor:default">
    <span class="badge ${h.tone > 0 ? "b-green" : h.tone < 0 ? "b-red" : "b-gray"}">${h.tone > 0 ? "positiv" : h.tone < 0 ? "negativ" : "neutral"}</span>
    <div style="min-width:0"><div class="ev-title">${safeLink(h.link, esc(h.title))}</div>
    <div class="muted" style="font-size:12.5px">${esc(h.source || "")}${h.time ? " · " + dt(h.time) : ""}</div></div></div>`).join("")}</div>`;
}

function topReasons(d, sign) {
  return CATS.filter(c => sign > 0 ? d.scores[c] > 0 : d.scores[c] < 0)
    .sort((a, b) => sign * (d.scores[b] - d.scores[a]))
    .map(c => `<b>${c} ${d.scores[c] > 0 ? "+" : ""}${d.scores[c]}</b> (${esc((d.reasons[c] || []).filter(x => !/neutral|normal|kein klarer|keine Intraday/.test(x)).slice(0, 3).join(", ") || CAT_INFO[c].split("?")[0])})`);
}
function explain(d) {
  const name = `${esc(d.name)} (${esc(d.sym)})`;
  if (d.action === "KAUF") {
    const pros = topReasons(d, 1), cons = topReasons(d, -1);
    const thr = D.rules.buy_score ?? 6;
    return `Der Bot hat <b>${name}</b> gekauft, weil <b>alle Kaufregeln erfüllt</b> waren. Mit <b>${d.total} Punkten</b> lag die Aktie
      ${d.total - thr >= 4 ? "deutlich" : ""} über der Kaufschwelle von ${thr}. Dafür sprach: ${pros.join("; ")}.
      ${cons.length ? `Dagegen sprach: ${cons.join("; ")} – das wog aber weniger schwer.` : "Kein Bereich sprach dagegen."}
      Die Marktlage war <b>${esc(d.regime)}</b>. Investiert wurden <b>${eur(d.value)}</b> (${nf(d.shares, 4)} Stück zu ${usd(d.price)}).
      Automatischer Verkauf, falls der Kurs unter <b>${usd(d.levels?.stop)}</b> fällt (Stop-Loss) oder der Score auf ${d.levels?.sell_score ?? D.rules.sell_score} sinkt.`;
  }
  const res = d.pnl >= 0 ? `mit <b class="up">${signed(d.pnl)}</b> Gewinn (${pct(d.pnl_pct)})` : `mit <b class="down">${signed(d.pnl)}</b> Verlust (${pct(d.pnl_pct)})`;
  const why = {
    stop: `der Kurs unter die Verlustgrenze (Stop-Loss bei ${usd(d.levels?.stop)}) gefallen ist. Der Stop begrenzt Verluste, bevor sie größer werden.`,
    trailing: `der Kurs vom Hoch seit dem Kauf (${usd(d.levels?.peak)}) zu stark zurückgefallen ist (Trailing-Stop bei ${usd(d.levels?.trail)}). So wird ein Teil des Gewinns gesichert.`,
    block: `die SEC eine Warnmeldung veröffentlicht hat (${esc(d.block)}). Bei solchen Risiken steigt der Bot sofort aus.`,
    score: `sich das Gesamtbild verschlechtert hat: Der Score fiel auf <b>${d.total}</b> (Grenze ${d.levels?.sell_score}). Schwach waren: ${topReasons(d, -1).join("; ")}.`,
  }[d.kind] || esc(d.why);
  return `Der Bot hat <b>${name}</b> ${res} verkauft, weil ${why} Gekauft am ${dt(d.bought)} zu ${usd(d.entry)}, verkauft zu ${usd(d.price)}.`;
}

// ------------------------------------------------------------------ Charts
function destroyCharts() { while (charts.length) charts.pop().destroy(); }
function baseOpts(extra = {}) {
  const muted = cssVar("--muted"), line = cssVar("--border");
  return Object.assign({maintainAspectRatio: false, animation: {duration: 300}, interaction: {mode: "index", intersect: false},
    plugins: {legend: {display: false}, tooltip: {backgroundColor: cssVar("--surface"), titleColor: cssVar("--text-h"),
      bodyColor: cssVar("--text"), borderColor: line, borderWidth: 1, padding: 10}},
    scales: {x: {ticks: {color: muted, maxTicksLimit: 6, maxRotation: 0}, grid: {display: false}, border: {display: false}},
             y: {ticks: {color: muted}, grid: {color: line}, border: {display: false}}}}, extra);
}
function sparkSVG(xs, w = 90, h = 28) {
  if (!xs?.length) return "";
  const s = xs.slice(-60), lo = Math.min(...s), hi = Math.max(...s), up = s.at(-1) >= s[0];
  const pts = s.map((v, i) => `${(i / (s.length - 1) * w).toFixed(1)},${(h - 2 - (v - lo) / ((hi - lo) || 1) * (h - 4)).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${up ? cssVar("--green") : cssVar("--red")}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

function header(title, sub, right = "") {
  return `<div class="page-header"><div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div>${right}</div>`;
}
function regimeBadge() {
  const m = D.an?.regime?.mode;
  if (!m) return `<span class="badge b-gray">Marktlage –</span>`;
  return `<span class="badge ${m === "normal" ? "b-green" : m === "vorsichtig" ? "b-yellow" : "b-red"}" title="${esc(D.an.regime.why.join(" · "))}"><span class="dot"></span>Markt ${esc(m)}</span>`;
}
function marketBadge() {
  const m = D.st?.market || D.an?.market;
  if (!m) return `<span class="badge b-gray">noch kein Lauf</span>`;
  return `<span class="badge ${m.open ? "b-green" : "b-gray"}"><span class="dot"></span>Börse ${m.open ? "offen" : "zu"}</span>`;
}

  let vsSpx = null;
  const withSpy = eq.filter(r => r.spy);

      ${stat("globe", "t-yellow", "vs. S&P 500", vsSpx == null ? "–" : `<span class="${cls(vsSpx)}">${pct(vsSpx)}</span>`, "Vorsprung seit Start")}
      ${stat("cash", "t-green", "Freies Geld", eur(cash), pct(cash / equity * 100).replace("+", "") + " des Depots")}

    <div class="panel-grid">
      <div class="panel wide">

          <div style="display:flex;gap:8px;flex-wrap:wrap">

              `<button data-r="${k}" class="${ui.range === k ? "active" : ""}">${l}</button>`).join("")}</div>

      </div>

        <div class="chart-box small"><canvas id="allocChart"></canvas></div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>Marktlage</h2>${regimeBadge()}</div>
        ${D.an?.regime ? `<dl class="kv">
          <dt>S&amp;P 500</dt><dd>${usd(D.an.regime.spy)} <span class="muted">(50T ${usd(D.an.regime.spy_sma50, 0)}, 200T ${usd(D.an.regime.spy_sma200, 0)})</span></dd>
          <dt>VIX</dt><dd>${D.an.regime.vix != null ? nf(D.an.regime.vix, 1) : "–"} <span class="muted">${D.an.regime.vix >= 30 ? "Panik" : D.an.regime.vix >= 22 ? "nervös" : "ruhig"}</span></dd>

        </dl><p class="muted" style="font-size:13px;margin:12px 0 0">${esc(D.an.regime.why.join(" · "))}</p>` : `<div class="empty">Noch keine Analyse.</div>`}

function drawOverviewCharts() {
  const now = Date.now(), lim = {"1d": 864e5, "7d": 6048e5, "30d": 2592e6}[ui.range];
  const rows = D.eq.filter(r => !lim || now - new Date(r.zeit) <= lim);

    else {
      const e0 = parseFloat(rows[0].depotwert_eur), sRow = rows.find(r => r.spy), s0 = sRow ? parseFloat(sRow.spy) : null;
      const blue = cssVar("--blue");
      const ctx = cv.getContext("2d"), g = ctx.createLinearGradient(0, 0, 0, 290);
      g.addColorStop(0, blue + "33"); g.addColorStop(1, blue + "00");
      const ds = [{label: "Bot", data: rows.map(r => parseFloat(r.depotwert_eur)), borderColor: blue, backgroundColor: g, fill: true, borderWidth: 2, pointRadius: 0, tension: .25}];
      if (ui.spx && s0) ds.push({label: "S&P 500", data: rows.map(r => r.spy ? e0 * parseFloat(r.spy) / s0 : null), borderColor: cssVar("--muted"), borderDash: [4, 4], borderWidth: 1.5, pointRadius: 0, tension: .25});
      charts.push(new Chart(cv, {type: "line", data: {labels: rows.map(r => dt(r.zeit)), datasets: ds},
        options: baseOpts({plugins: {...baseOpts().plugins, tooltip: {...baseOpts().plugins.tooltip, callbacks: {label: c => `${c.dataset.label}: ${eur(c.parsed.y)}`}}},
          scales: {...baseOpts().scales, y: {...baseOpts().scales.y, ticks: {color: cssVar("--muted"), callback: v => nf(v, 0) + " €"}}}})}));
    }
  }
  const ac = $("#allocChart");
  if (ac) {
    const palette = ["--blue", "--purple", "--green", "--yellow", "--red"].map(cssVar);
    const items = D.positions.map(p => [p.sym, p.value]).concat([["Cash", D.cash]]);
    charts.push(new Chart(ac, {type: "doughnut", data: {labels: items.map(i => i[0]), datasets: [{data: items.map(i => i[1]),
      backgroundColor: items.map((_, i) => i === items.length - 1 ? cssVar("--border") : palette[i % palette.length] + (i >= palette.length ? "99" : "")),
      borderColor: cssVar("--surface"), borderWidth: 2}]},
      options: {maintainAspectRatio: false, cutout: "62%", plugins: {legend: {position: "right", labels: {color: cssVar("--text"), boxWidth: 10, font: {size: 12}}},

}

function verdictBadge(v) {
  const c = v === "Gekauft" || v === "Kaufkandidat" ? "b-green" : v === "Verkauft" ? "b-red" : v === "Halten" ? "b-blue" : v?.startsWith("Kaufkandidat") ? "b-yellow" : "b-gray";
  return `<span class="badge ${c}">${esc(v || "–")}</span>`;
}

function viewStocks() {
  const held = new Set(D.positions.map(p => p.sym));
  let rows = D.rows.filter(r => {
    if (ui.q && !(r.sym + " " + r.name).toLowerCase().includes(ui.q.toLowerCase())) return false;
    if (ui.stockFilter === "held") return held.has(r.sym);
    if (ui.stockFilter === "cand") return r.checks?.every(c => c.ok);
    if (ui.stockFilter === "no") return !held.has(r.sym) && !r.checks?.every(c => c.ok);
    return true;
  });
  const key = ui.stockSort;
  rows = rows.slice().sort((a, b) => {
    const va = key === "sym" ? a.sym : key === "chg" ? a.ind?.chg ?? 0 : CATS.includes(key) ? a.scores[key] : a[key];
    const vb = key === "sym" ? b.sym : key === "chg" ? b.ind?.chg ?? 0 : CATS.includes(key) ? b.scores[key] : b[key];
    return (va > vb ? 1 : va < vb ? -1 : 0) * ui.stockDir;
  });
  const th = (k, l, r = true) => `<th class="sortable ${r ? "r" : ""}" data-sort="${k}">${l}${ui.stockSort === k ? (ui.stockDir > 0 ? " ↑" : " ↓") : ""}</th>`;
  return header("Aktien & Analyse", `${D.rows.length} Aktien beobachtet · Analyse vom ${D.an ? dt(D.an.time) : "–"} · Zeile antippen für Details`) + `
  <div class="toolbar">
    <input type="search" id="q" placeholder="Aktie suchen …" value="${esc(ui.q)}">
    <div class="segmented" id="sf">${[["all", "Alle"], ["held", "Im Depot"], ["cand", "Kaufkandidaten"], ["no", "Nicht gekauft"]].map(([k, l]) =>

  </div>
  <div class="panel" style="padding:8px 12px">
    ${rows.length ? `<div class="table-wrap"><table class="data-table">
      <tr>${th("sym", "Aktie", false)}<th class="r">Kurs</th>${th("chg", "Tag")}<th>60 Tage</th>${th("total", "Score")}
        ${CATS.map(c => th(c, c)).join("")}<th>Urteil</th></tr>
      ${rows.map(r => `<tr class="clickable-row" data-go="#aktie/${encodeURIComponent(r.sym)}">
        <td><b>${esc(r.sym)}</b>${held.has(r.sym) ? ` <span class="badge b-blue" style="padding:1px 6px;font-size:11px">Depot</span>` : ""}<div class="muted name-cell" style="font-size:12.5px">${esc(r.name)}</div></td>
        <td class="r num">${usd(r.price)}<div class="muted" style="font-size:12px">${eur(r.price_eur)}</div></td>
        <td class="r num ${cls(r.ind?.chg)}">${pct(r.ind?.chg, 1)}</td>
        <td>${sparkSVG(r.ind?.spark)}</td>
        <td class="r">${scoreChip(r.total)}</td>
        ${CATS.map(c => `<td class="r">${scoreChip(r.scores[c])}</td>`).join("")}
        <td>${verdictBadge(r.verdict)}</td></tr>`).join("")}
    </table></div>` : `<div class="empty">Keine Aktien für diesen Filter.</div>`}
  </div>`;
}

function viewStock(sym) {

       Er verkauft automatisch, wenn der Kurs unter <b>${usd(r.levels?.stop)}</b> fällt${r.levels?.trail ? `, unter <b>${usd(r.levels.trail)}</b> zurückfällt (Trailing-Stop)` : ""} oder der Score auf <b>${r.levels?.sell_score}</b> sinkt (jetzt: ${r.total}).`
    : allOk ? `${esc(sym)} erfüllt <b>alle Kaufregeln</b>${r.verdict?.includes("kein freies") ? ", aber es ist gerade kein freies Geld da" : ""}.`

  <div class="page-header" style="margin-top:6px"><div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1>${esc(r.name)}</h1><span class="ticker-chip">${esc(sym)}</span>${verdictBadge(r.verdict)}${r.block ? `<span class="badge b-red">Warnung: ${esc(r.block)}</span>` : ""}</div>
      <div style="display:flex;align-items:baseline;gap:12px;margin-top:6px;flex-wrap:wrap"><span class="price-big">${usd(r.price)}</span>
        <span class="num ${cls(r.ind?.chg)}">${pct(r.ind?.chg)} heute</span><span class="muted num">≈ ${eur(r.price_eur)}</span></div>
    </div>${scoreChip(r.total)}</div>
  <div class="stack">
    <div class="explain ${!pos && !allOk ? "sell" : ""}" style="margin:0">${summary}</div>
    <div class="panel-grid">
      <div class="panel wide"><div class="panel-header"><h2>Kursverlauf</h2>
        <div class="legend-row muted"><span style="--c:${cssVar("--blue")}">Kurs</span><span style="--c:${cssVar("--yellow")}">50-Tage-Linie</span>${pos ? `<span style="--c:${cssVar("--green")}">Einstand</span><span style="--c:${cssVar("--red")}">Stop</span>` : ""}</div></div>
        <div class="chart-box"><canvas id="stockChart"></canvas></div></div>
      <div class="panel"><div class="panel-header"><h2>Punkte nach Bereich</h2><span class="muted" style="font-size:13px">Gesamt ${r.total > 0 ? "+" : ""}${r.total}</span></div>${scoreBars(r.scores, r.reasons)}</div>
      <div class="panel"><div class="panel-header"><h2>Kaufregeln</h2>${allOk ? `<span class="badge b-green">alle erfüllt</span>` : `<span class="badge b-gray">${failed.length} nicht erfüllt</span>`}</div>${checklist(r.checks)}</div>
      ${pos ? `<div class="panel"><div class="panel-header"><h2>Position</h2></div><dl class="kv">
        <dt>Stück</dt><dd>${nf(pos.shares, 4)}</dd><dt>Investiert</dt><dd>${eur(pos.cost_eur)}</dd><dt>Wert jetzt</dt><dd>${eur(pos.value)}</dd>
        <dt>Gewinn/Verlust</dt><dd class="${cls(pos.pnl)}">${signed(pos.pnl)} (${pct(pos.pnlPct)})</dd><dt>Einstand</dt><dd>${usd(pos.entry)}</dd>
        <dt>Hoch seit Kauf</dt><dd>${usd(pos.peak)}</dd><dt>Stop-Loss</dt><dd>${usd(r.levels?.stop)}</dd><dt>Trailing-Stop</dt><dd>${r.levels?.trail ? usd(r.levels.trail) : "aktiv ab Gewinn"}</dd></dl></div>` : ""}
      <div class="panel wide"><div class="panel-header"><h2>Begründung im Detail</h2></div>${reasonList(r)}</div>
      <div class="panel wide"><div class="panel-header"><h2>Indikatoren</h2><span class="muted" style="font-size:13px">ⓘ antippen/hovern für Erklärung</span></div>${indGrid(r)}</div>
      <div class="panel"><div class="panel-header"><h2>Schlagzeilen</h2></div>${headlineList(r.headlines)}</div>
      <div class="panel"><div class="panel-header"><h2>Ereignisse (30 Tage)</h2></div>
        ${evs.length ? `<div class="list-compact">${evs.slice(0, 12).map(e => `<div class="item" style="cursor:default">${evIcon(e, 30)}
          <div style="min-width:0"><div class="ev-title" style="font-size:14px">${safeLink(e.link, esc(e.title))}</div><div class="muted" style="font-size:12.5px">${EV_TYPES[e.type]?.l || ""} · ${e.time ? dt(e.time) : ""}</div></div></div>`).join("")}</div>` : `<div class="empty">Keine Ereignisse.</div>`}</div>
      ${decs.length ? `<div class="panel wide"><div class="panel-header"><h2>Entscheidungen des Bots</h2></div><div class="list-compact">${decs.map(d =>
        `<div class="item" data-go="#entscheidungen/${encodeURIComponent(d.id)}"><span class="badge ${d.action === "KAUF" ? "b-green" : "b-red"}">${d.action === "KAUF" ? "Kauf" : "Verkauf"}</span>
        <div style="flex:1"><div class="ev-title">${dt(d.time)} · ${eur(d.value)} zu ${usd(d.price)}</div><div class="muted" style="font-size:12.5px">${esc(d.why)}</div></div>
        ${d.pnl != null ? `<span class="num ${cls(d.pnl)}">${signed(d.pnl)}</span>` : ""}</div>`).join("")}</div></div>` : ""}

}
function drawStockChart(sym) {
  const r = D.bySym[sym], cv = $("#stockChart");
  if (!r || !cv) return;
  const xs = r.ind?.spark || [];
  if (xs.length < 2) { cv.parentElement.innerHTML = `<div class="empty">Keine Kursdaten.</div>`; return; }
  const all = xs.slice(0, -1).concat([r.price]);
  const sma = all.map((_, i) => i >= 49 ? all.slice(i - 49, i + 1).reduce((a, b) => a + b, 0) / 50 : null);
  const pos = D.positions.find(p => p.sym === sym);
  const n = all.length, labels = all.map((_, i) => i === n - 1 ? "heute" : `−${n - 1 - i} T`);
  const ds = [{label: "Kurs", data: all, borderColor: cssVar("--blue"), borderWidth: 2, pointRadius: 0, tension: .2},
              {label: "50-Tage-Linie", data: sma, borderColor: cssVar("--yellow"), borderWidth: 1.5, pointRadius: 0, tension: .2}];
  if (pos) {
    ds.push({label: "Einstand", data: all.map(() => pos.entry), borderColor: cssVar("--green"), borderDash: [5, 4], borderWidth: 1.2, pointRadius: 0});
    if (r.levels?.stop) ds.push({label: "Stop", data: all.map(() => r.levels.stop), borderColor: cssVar("--red"), borderDash: [5, 4], borderWidth: 1.2, pointRadius: 0});
  }
  charts.push(new Chart(cv, {type: "line", data: {labels, datasets: ds}, options: baseOpts({plugins: {...baseOpts().plugins,
    tooltip: {...baseOpts().plugins.tooltip, callbacks: {label: c => `${c.dataset.label}: ${usd(c.parsed.y)}`}}}})}));
}

const EV_TYPES = {
  news: {l: "News", i: "doc", t: "t-blue"}, filing: {l: "SEC-Meldung", i: "bank", t: "t-purple"},
  congress: {l: "Kongress", i: "globe", t: "t-yellow"}, trade: {l: "Bot-Trade", i: "bot", t: "t-green"},
  market: {l: "Markt", i: "trend", t: "t-red"},
};
function evIcon(e, s = 34) {
  const t = EV_TYPES[e.type] || EV_TYPES.news;
  let tint = t.t;
  if (e.type === "news") tint = e.tone > 0 ? "t-green" : e.tone < 0 ? "t-red" : "t-blue";
  if (e.type === "filing" && e.severity === "block") tint = "t-red";
  return `<div class="ev-icon stat-icon ${tint}" style="width:${s}px;height:${s}px">${icon(ICONS[t.i], s * .5)}</div>`;
}
function viewNews() {
  const syms = [...new Set(D.ev.map(e => e.sym))].sort();
  const list = D.ev.filter(e => (ui.evType === "all" || e.type === ui.evType)
    && (ui.evTone === "all" || (ui.evTone === "pos" ? e.tone > 0 : e.tone < 0))
    && (!ui.evSym || e.sym === ui.evSym)
    && (!ui.evQ || (e.title + " " + (e.summary || "") + " " + e.sym).toLowerCase().includes(ui.evQ.toLowerCase())));
  const counts = Object.fromEntries(Object.keys(EV_TYPES).map(k => [k, D.ev.filter(e => e.type === k).length]));
  let lastDay = "", html = "";
  for (const e of list.slice(0, 300)) {
    const day = e.time ? new Date(e.time).toDateString() : "";
    if (day !== lastDay) { html += `<div class="day-label">${e.time ? dday(e.time) : "ohne Datum"}</div>`; lastDay = day; }
    html += `<div class="event">${evIcon(e)}<div class="ev-main">
      <div class="ev-title">${safeLink(e.link, esc(e.title))}</div>
      ${e.summary ? `<div class="ev-detail">${esc(e.summary)}</div>` : ""}${e.detail ? `<div class="ev-detail">${esc(e.detail)}</div>` : ""}
      <div class="ev-meta"><span class="ticker-chip" data-go="#aktie/${encodeURIComponent(e.sym)}">${esc(e.sym)}</span>
        <span>${EV_TYPES[e.type]?.l || e.type}</span>${e.source ? `<span>${esc(e.source)}</span>` : ""}
        ${e.time ? `<span>${new Date(e.time).toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"})}</span>` : ""}
        ${e.type === "news" ? `<span class="badge ${e.tone > 0 ? "b-green" : e.tone < 0 ? "b-red" : "b-gray"}" style="padding:1px 8px">${e.tone > 0 ? "positiv" : e.tone < 0 ? "negativ" : "neutral"}</span>` : ""}
        ${(e.tags || []).map(t => `<span class="badge b-gray" style="padding:1px 8px">${esc(t)}</span>`).join("")}</div>
    </div></div>`;
  }
  return header("News & Ereignisse", "Schlagzeilen, SEC-Meldungen, Kongress-Trades, Bot-Trades und Wechsel der Marktlage der letzten 30 Tage.") + `
  <div class="toolbar">
    <div class="segmented" id="evt"><button data-t="all" class="${ui.evType === "all" ? "active" : ""}">Alle (${D.ev.length})</button>
      ${Object.entries(EV_TYPES).map(([k, v]) => `<button data-t="${k}" class="${ui.evType === k ? "active" : ""}">${v.l} (${counts[k]})</button>`).join("")}</div>
    <div class="segmented" id="evtone">${[["all", "Jede Stimmung"], ["pos", "Positiv"], ["neg", "Negativ"]].map(([k, l]) =>
      `<button data-t="${k}" class="${ui.evTone === k ? "active" : ""}">${l}</button>`).join("")}</div>
    <select id="evsym"><option value="">Alle Aktien</option>${syms.map(s => `<option ${ui.evSym === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
    <input type="search" id="evq" placeholder="Suchen …" value="${esc(ui.evQ)}">
  </div>
  ${list.length ? `<div class="feed">${html}</div>` : `<div class="panel"><div class="empty">Keine Ereignisse für diesen Filter.</div></div>`}`;
}

// ------------------------------------------------------------------ Router
function render() {
  destroyCharts();
  const [route, arg] = decodeURIComponent(location.hash.slice(1) || "uebersicht").split("/");
  const active = route === "aktie" ? "aktien" : route;
  $("#nav").innerHTML = NAV.map(([k, l]) => `<a href="#${k}" class="${active === k ? "nav-active" : ""}">${icon(ICONS[k], 17)}${l}</a>`).join("");
  $("#side-status").innerHTML = D.st?.checked ? `Letzte Prüfung ${ago(D.st.checked)}` : "";
  const v = $("#view");
  if (route === "entscheidungen") v.innerHTML = viewDecisions(arg);
  else if (route === "aktien") v.innerHTML = viewStocks();
  else if (route === "aktie") v.innerHTML = viewStock(arg);
  else if (route === "news") v.innerHTML = viewNews();
  else if (route === "regeln") v.innerHTML = viewRules();
  else { v.innerHTML = viewOverview(); drawOverviewCharts(); }
  if (route === "aktie") drawStockChart(arg);
  if (route === "entscheidungen" && arg) document.getElementById("dec-" + arg)?.scrollIntoView({block: "start"});
}

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go && !e.target.closest("a")) { location.hash = go.dataset.go; return; }
  const t = e.target.closest("[data-toggle]");
  if (t) { const id = t.dataset.toggle; ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id);
           history.replaceState(null, "", "#entscheidungen"); render(); return; }
  const btn = e.target.closest("button"); if (!btn) return;
  const par = btn.parentElement?.id;
  if (par === "range") { ui.range = btn.dataset.r; render(); }
  else if (btn.id === "spx") { ui.spx = !ui.spx; render(); }
  else if (par === "decf") { ui.decFilter = btn.dataset.f; render(); }
  else if (par === "sf") { ui.stockFilter = btn.dataset.f; render(); }
  else if (par === "evt") { ui.evType = btn.dataset.t; render(); }
  else if (par === "evtone") { ui.evTone = btn.dataset.t; render(); }
});
document.addEventListener("click", e => {
  const th = e.target.closest("th[data-sort]"); if (!th) return;
  const k = th.dataset.sort; ui.stockDir = ui.stockSort === k ? -ui.stockDir : (k === "sym" ? 1 : -1); ui.stockSort = k; render();
});
document.addEventListener("input", e => {
  const id = e.target.id, pos = e.target.selectionStart;
  if (id === "q") ui.q = e.target.value; else if (id === "evq") ui.evQ = e.target.value; else if (id === "evsym") ui.evSym = e.target.value; else return;
  render(); const el = document.getElementById(id); if (el && el.focus && id !== "evsym") { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

(async () => { await loadData(); render(); })();
setInterval(async () => { await loadData(); render(); }, 5 * 60 * 1000);
</script>
</body>
</html>
